# CI: path-based — backend / frontend jobs run only when matching paths change.
# Shared triggers: workflow file + docker-compose affect both (re-run full relevant checks).

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: read
  id-token: write

env:
  # Opt into Node.js 24 for JavaScript-based GitHub Actions.
  # This avoids upcoming runner default changes and deprecation warnings.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  AWS_REGION: eu-west-1
  ECR_BACKEND_REPO: companyNM-backend
  ECR_FRONTEND_REPO: companyNM-frontend

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/ci.yml'
              - 'docker-compose.yml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/ci.yml'
              - 'docker-compose.yml'

  backend-lint-test:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx==0.27.0 ruff pip-audit

      - name: Lint (ruff)
        run: ruff check .

      - name: Tests (pytest)
        env:
          LOG_LEVEL: WARNING
        run: pytest -q

      - name: Python dependency security audit (pip-audit)
        run: pip-audit -r requirements.txt

  frontend-lint-build:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          # package-lock.json isn't guaranteed to exist (we fall back to `npm install`).
          # Provide at least one resolvable path so setup-node caching doesn't error.
          cache-dependency-path: |
            frontend/package-lock.json
            frontend/package.json

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Lint (next)
        run: npm run lint

      - name: Build (next)
        run: npm run build

  docker-build:
    name: Build images and export artifacts
    needs: [changes, backend-lint-test, frontend-lint-build]
    if: >
      always() &&
      (needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true') &&
      (needs.changes.outputs.backend != 'true' || needs.backend-lint-test.result == 'success') &&
      (needs.changes.outputs.frontend != 'true' || needs.frontend-lint-build.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3
      # Buildx cache to speed up repeat CI builds without pushing images anywhere.
      # we can also consider using ECR /cache ECR repos I prepared for this in terraform ECR part, we can add an optional registry cache export on push-to-main.
      - name: Build backend image (local, cached)
        if: needs.changes.outputs.backend == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          target: runtime
          load: true
          tags: companyNM-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image (local, cached)
        if: needs.changes.outputs.frontend == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          target: runtime
          load: true
          tags: companyNM-frontend:ci
          # For security scanning we want the deps layer to reflect current lockfile,
          # not a previously cached node_modules tree.
          no-cache: true

      - name: Export backend image artifact (tar)
        if: needs.changes.outputs.backend == 'true'
        run: |
          mkdir -p image-artifacts
          docker save companyNM-backend:ci -o image-artifacts/companyNM-backend_ci.tar

      - name: Export frontend image artifact (tar)
        if: needs.changes.outputs.frontend == 'true'
        run: |
          mkdir -p image-artifacts
          docker save companyNM-frontend:ci -o image-artifacts/companyNM-frontend_ci.tar

      - name: Verify exported image artifacts exist
        run: |
          echo "Artifacts directory contents:"
          ls -la image-artifacts || true
          count="$(ls -1 image-artifacts/*.tar 2>/dev/null | wc -l | tr -d ' ')"
          echo "Found ${count} tar files"
          test "${count}" -gt 0

      - name: Upload image artifacts
        if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: docker-images
          # Avoid glob edge-cases; upload the directory.
          path: image-artifacts
          if-no-files-found: error

  container-structure-tests:
    runs-on: ubuntu-latest
    needs: [changes, docker-build]
    if: always() && needs.docker-build.result == 'success'
    steps:
      - uses: actions/checkout@v4

      - name: Download built images (tar artifacts)
        uses: actions/download-artifact@v4
        with:
          name: docker-images
          path: image-artifacts

      - name: Load images into Docker
        run: |
          if [ "${{ needs.changes.outputs.backend }}" = "true" ]; then
            docker load -i image-artifacts/companyNM-backend_ci.tar
          fi
          if [ "${{ needs.changes.outputs.frontend }}" = "true" ]; then
            docker load -i image-artifacts/companyNM-frontend_ci.tar
          fi

      - name: Install container-structure-test
        run: |
          curl -fsSL -o /usr/local/bin/container-structure-test \
            https://storage.googleapis.com/container-structure-test/latest/container-structure-test-linux-amd64
          chmod +x /usr/local/bin/container-structure-test

      - name: Run structure tests
        run: |
          if [ "${{ needs.changes.outputs.backend }}" = "true" ]; then
            container-structure-test test --image companyNM-backend:ci --config tests/container-structure/backend.yaml
          fi
          if [ "${{ needs.changes.outputs.frontend }}" = "true" ]; then
            container-structure-test test --image companyNM-frontend:ci --config tests/container-structure/frontend.yaml
          fi

  trivy-container-scan:
    runs-on: ubuntu-latest
    needs: [changes, docker-build]
    if: always() && needs.docker-build.result == 'success'
    steps:
      - uses: actions/checkout@v4

      - name: Download built images (tar artifacts)
        uses: actions/download-artifact@v4
        with:
          name: docker-images
          path: image-artifacts

      - name: Load images into Docker
        run: |
          if [ "${{ needs.changes.outputs.backend }}" = "true" ]; then
            docker load -i image-artifacts/companyNM-backend_ci.tar
          fi
          if [ "${{ needs.changes.outputs.frontend }}" = "true" ]; then
            docker load -i image-artifacts/companyNM-frontend_ci.tar
          fi

      - name: Scan backend image (Trivy)
        if: needs.changes.outputs.backend == 'true'
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: companyNM-backend:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"

      - name: Scan frontend image (Trivy)
        if: needs.changes.outputs.frontend == 'true'
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: companyNM-frontend:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"

  push-ecr:
    name: Push images to ECR
    runs-on: ubuntu-latest
    needs: [changes, docker-build, container-structure-tests, trivy-container-scan]
    if: >
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.docker-build.result == 'success' &&
      needs.container-structure-tests.result == 'success' &&
      needs.trivy-container-scan.result == 'success'
    steps:
      - uses: actions/checkout@v4

      - name: Download built images (tar artifacts)
        uses: actions/download-artifact@v4
        with:
          name: docker-images
          path: image-artifacts

      - name: Load images into Docker
        run: |
          if [ "${{ needs.changes.outputs.backend }}" = "true" ]; then
            docker load -i image-artifacts/companyNM-backend_ci.tar
          fi
          if [ "${{ needs.changes.outputs.frontend }}" = "true" ]; then
            docker load -i image-artifacts/companyNM-frontend_ci.tar
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Tag and push backend to ECR
        if: needs.changes.outputs.backend == 'true'
        run: |
          docker tag companyNM-backend:ci "${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_BACKEND_REPO }}:${{ github.sha }}"
          docker tag companyNM-backend:ci "${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_BACKEND_REPO }}:latest"
          docker push "${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_BACKEND_REPO }}:${{ github.sha }}"
          docker push "${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_BACKEND_REPO }}:latest"

      - name: Tag and push frontend to ECR
        if: needs.changes.outputs.frontend == 'true'
        run: |
          docker tag companyNM-frontend:ci "${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_FRONTEND_REPO }}:${{ github.sha }}"
          docker tag companyNM-frontend:ci "${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_FRONTEND_REPO }}:latest"
          docker push "${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_FRONTEND_REPO }}:${{ github.sha }}"
          docker push "${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_FRONTEND_REPO }}:latest"
