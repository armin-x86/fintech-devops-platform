# CI: path-based — backend / frontend jobs run only when matching paths change.
# Shared triggers: workflow file + docker-compose affect both (re-run full relevant checks).

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: read
  id-token: write

env:
  AWS_REGION: eu-west-1
  ECR_BACKEND_REPO: fence-backend
  ECR_FRONTEND_REPO: fence-frontend

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/ci.yml'
              - 'docker-compose.yml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/ci.yml'
              - 'docker-compose.yml'

  backend-lint-test:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx==0.27.0 ruff pip-audit

      - name: Lint (ruff)
        run: ruff check .

      - name: Tests (pytest)
        env:
          LOG_LEVEL: WARNING
        run: pytest -q

      - name: Python dependency security audit (pip-audit)
        run: pip-audit -r requirements.txt

  frontend-lint-build:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          # package-lock.json isn't guaranteed to exist (we fall back to `npm install`).
          # Provide at least one resolvable path so setup-node caching doesn't error.
          cache-dependency-path: |
            frontend/package-lock.json
            frontend/package.json

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Lint (next)
        run: npm run lint

      - name: Build (next)
        run: npm run build

  docker-build-and-push-ecr:
    name: Build images locally
    needs: [changes, backend-lint-test, frontend-lint-build]
    if: >
      always() &&
      (needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true') &&
      (needs.changes.outputs.backend != 'true' || needs.backend-lint-test.result == 'success') &&
      (needs.changes.outputs.frontend != 'true' || needs.frontend-lint-build.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3
      - name: Build backend image (local)
        if: needs.changes.outputs.backend == 'true'
        run: docker build -t fence-backend:ci -f backend/Dockerfile --target runtime .

      - name: Build frontend image (local)
        if: needs.changes.outputs.frontend == 'true'
        run: docker build -t fence-frontend:ci -f frontend/Dockerfile --target runtime .

  container-structure-tests:
    runs-on: ubuntu-latest
    needs: [changes, docker-build-and-push-ecr]
    if: always() && needs.docker-build-and-push-ecr.result == 'success'
    steps:
      - uses: actions/checkout@v4

      - name: Install container-structure-test
        run: |
          curl -fsSL -o /usr/local/bin/container-structure-test \
            https://storage.googleapis.com/container-structure-test/latest/container-structure-test-linux-amd64
          chmod +x /usr/local/bin/container-structure-test

      - name: Run structure tests
        run: |
          if [ "${{ needs.changes.outputs.backend }}" = "true" ]; then
            container-structure-test test --image fence-backend:ci --config tests/container-structure/backend.yaml
          fi
          if [ "${{ needs.changes.outputs.frontend }}" = "true" ]; then
            container-structure-test test --image fence-frontend:ci --config tests/container-structure/frontend.yaml
          fi

  trivy-container-scan:
    runs-on: ubuntu-latest
    needs: [changes, docker-build-and-push-ecr]
    if: always() && needs.docker-build-and-push-ecr.result == 'success'
    steps:
      - uses: actions/checkout@v4

      - name: Scan backend image (Trivy)
        if: needs.changes.outputs.backend == 'true'
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: fence-backend:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"

      - name: Scan frontend image (Trivy)
        if: needs.changes.outputs.frontend == 'true'
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: fence-frontend:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"

  push-ecr:
    name: Push images to ECR (only after tests/scans)
    runs-on: ubuntu-latest
    needs: [changes, docker-build-and-push-ecr, container-structure-tests, trivy-container-scan]
    if: >
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.docker-build-and-push-ecr.result == 'success' &&
      needs.container-structure-tests.result == 'success' &&
      needs.trivy-container-scan.result == 'success'
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image (local)
        if: needs.changes.outputs.backend == 'true'
        run: docker build -t fence-backend:ci -f backend/Dockerfile --target runtime .

      - name: Build frontend image (local)
        if: needs.changes.outputs.frontend == 'true'
        run: docker build -t fence-frontend:ci -f frontend/Dockerfile --target runtime .

      - name: Configure AWS credentials (OIDC → IAM role)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Tag and push backend → ECR
        if: needs.changes.outputs.backend == 'true'
        run: |
          docker tag fence-backend:ci "${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_BACKEND_REPO }}:${{ github.sha }}"
          docker tag fence-backend:ci "${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_BACKEND_REPO }}:latest"
          docker push "${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_BACKEND_REPO }}:${{ github.sha }}"
          docker push "${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_BACKEND_REPO }}:latest"

      - name: Tag and push frontend → ECR
        if: needs.changes.outputs.frontend == 'true'
        run: |
          docker tag fence-frontend:ci "${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_FRONTEND_REPO }}:${{ github.sha }}"
          docker tag fence-frontend:ci "${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_FRONTEND_REPO }}:latest"
          docker push "${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_FRONTEND_REPO }}:${{ github.sha }}"
          docker push "${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_FRONTEND_REPO }}:latest"
