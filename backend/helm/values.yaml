replicaCount: 2

image:
  # ECR: <account>.dkr.ecr.<region>.amazonaws.com/companyNM-backend
  repository: 216315649159.dkr.ecr.eu-west-1.amazonaws.com/companyNM-backend
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8000

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

env:
  LOG_LEVEL: INFO
  # Comma-separated list of allowed browser origins for the API (CORS).
  # Example: "https://portfolio.ateimouri.com,http://localhost:3000"
  # Prefer setting this to your exact frontend origin(s) in prod.
  CORS_ALLOW_ORIGINS: "https://portfolio.ateimouri.com"

